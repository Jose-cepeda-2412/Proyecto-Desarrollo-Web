<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Espacios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestión de Espacios</h2>
    <a th:href="@{/admin/espacios/nuevo}" class="btn btn-primary">Nuevo Espacio</a>
</div>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Capacidad</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="e : ${espacios}">
        <td th:text="${e.id}"></td>
        <td th:text="${e.nombre}"></td>
        <td th:text="${e.capacidad}"></td>
        <td>
            <a th:href="@{/admin/espacios/editar/{id}(id=${e.id})}" class="btn btn-warning btn-sm">Editar</a>
            <a th:href="@{/admin/espacios/eliminar/{id}(id=${e.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar este espacio?');">Eliminar</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(espacios)}">
        <td colspan="4" class="text-center">No hay espacios registrados.</td>
    </tr>
    </tbody>
</table>

<a th:href="@{/reservas/nueva}" class="btn btn-secondary">Volver al Formulario de Reservas</a>
</body>
</html>
